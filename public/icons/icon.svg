<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040d16"/>
      <stop offset="50%" stop-color="#081827"/>
      <stop offset="100%" stop-color="#001e33"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66ccff"/>
      <stop offset="50%" stop-color="#0099cc"/>
      <stop offset="100%" stop-color="#006699"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5ffff"/>
      <stop offset="100%" stop-color="#99e6ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo redondeado estilo App Icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#0099cc" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Halo de resplandor -->
  <circle cx="256" cy="240" r="140" fill="#0099cc" opacity="0.18" filter="url(#glow)"/>

  <!-- Escudo Institucional / Silueta de Bulto Proteico & Víveres -->
  <path d="M256 90 L390 145 C390 270 330 350 256 405 C182 350 122 270 122 145 Z" 
        fill="url(#seaGrad)" opacity="0.95" filter="url(#glow)"/>

  <!-- Detalle interior del escudo -->
  <path d="M256 115 L365 160 C365 260 315 330 256 375 C197 330 147 260 147 160 Z" 
        fill="#040d16" opacity="0.7"/>

  <!-- Caja de Despacho / Símbolo de Beneficio Institucional -->
  <g transform="translate(186, 175) scale(0.27)">
    <!-- Cubo Isométrico / Paquete de Víveres y Proteína -->
    <path d="M256 60 L450 170 L256 280 L62 170 Z" fill="#66ccff" opacity="0.95"/>
    <path d="M62 170 L256 280 L256 470 L62 360 Z" fill="#0099cc"/>
    <path d="M450 170 L256 280 L256 470 L450 360 Z" fill="#006699"/>
    <!-- Cinta de amarre / sello -->
    <path d="M256 60 L256 280 L256 470" stroke="#e5ffff" stroke-width="18" opacity="0.8"/>
  </g>

  <!-- Ondas biométricas / Passkey TouchID en la base del escudo -->
  <path d="M216 325 Q256 305 296 325" stroke="#e5ffff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M200 345 Q256 320 312 345" stroke="#66ccff" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M226 362 Q256 345 286 362" stroke="#99e6ff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.75"/>

  <!-- Letras MIPPCI en la base -->
  <text x="256" y="465" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="28" font-weight="900" fill="#99e6ff" text-anchor="middle" letter-spacing="4">MIPPCI BIENESTAR</text>
</svg>
