openapi: 3.1.0
info:
  title: API Plataforma Combos Alimenticios con Passkeys & Offline-First (SGBT / MIPPCI)
  version: 4.2.0
  description: >
    Especificación OpenAPI 3.1 del API RESTful para la gestión y despacho seguro
    de combos alimenticios con autenticación biométrica FIDO2 / WebAuthn,
    criptografía asimétrica ECDSA P-256, segregación estricta de credenciales,
    autoservicio de recuperación de contraseñas y arquitectura offline-first.
  contact:
    name: Dirección de Tecnología de la Información - MIPPCI
    email: ti@mippci.gob.ve
  license:
    name: Propiedad del Estado Venezolano / MIPPCI

servers:
  - url: /api/v1
    description: Servidor de Aplicación Local / Centro de Distribución
  - url: https://sgbt-combos.gob.ve/api/v1
    description: Servidor de Producción Centralizada (Nube)

tags:
  - name: Autenticación & Passkeys
    description: Gestión de sesiones, login, logout, registro y autenticación WebAuthn FIDO2
  - name: Supervisor & Jornadas
    description: Desafíos QR diarios del supervisor y enrolamiento presencial de operadores
  - name: Despacho & Verificación
    description: Verificación QR en línea/offline, validación criptográfica y streaming de entregas (SSE)
  - name: Despacho Manual & Contingencia
    description: Búsqueda manual por cédula, consulta de combos y registro con firma digital de contingencia
  - name: Sincronización Offline-First
    description: Intercambio bidireccional de registros (pull y push) entre SQLite local y Supabase PostgreSQL
  - name: Nómina & Beneficiarios
    description: Carga de nómina CSV, gestión de beneficiarios y asignación de cuotas
  - name: Sistema & Diagnóstico
    description: Estado del motor criptográfico, catálogo de combos, backups y mantenimiento

paths:
  /dispatch/atomic-claim:
    post:
      tags:
        - Despacho & Verificación
      summary: Despacho Atómico Totalizado (Fase 3)
      description: >
        Liquida en un solo escaneo QR o lectura de proximidad todos los combos asignados al trabajador
        para la jornada activa (víveres, proteína, especiales), previniendo dobles retiros.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - qr_payload
              properties:
                qr_payload:
                  type: string
                  description: Payload firmado o string QR escaneado
                mode:
                  type: string
                  enum: [total, station]
                  default: total
      responses:
        '200':
          description: Beneficios liquidados exitosamente
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Parámetros inválidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /dispatch/void:
    post:
      tags:
        - Despacho & Verificación
      summary: Anular despacho erróneo (Supervisor / Admin)
      description: >
        Permite a un supervisor o administrador anular una entrega registrada por equivocación
        dentro de una ventana máxima de 15 minutos, restaurando la asignación diaria a pendiente.
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - delivery_id
                - reason
              properties:
                delivery_id:
                  type: string
                  format: uuid
                  example: "4f7a26f3-bc44-48e2-9d32-dcfbf1f12629"
                reason:
                  type: string
                  example: "Equivocación en cédula al despachar en mesa 2"
      responses:
        '200':
          description: Despacho anulado y asignación revertida
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Despacho anulado correctamente y beneficio reestablecido"
                  data:
                    type: object
        '404':
          description: El despacho no fue encontrado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Expiración de ventana de 15 minutos o error de validación
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/login:
    post:
      tags:
        - Autenticación & Passkeys
      summary: Iniciar sesión institucional (Beneficiario / Almacén / Administrador)
      description: >
        Autentica un beneficiario, operador de despacho o administrador del sistema mediante Cédula de Identidad
        o Correo Institucional. Si se especifica `is_admin_login: true`, exige la validación de rol administrativo
        y la verificación de clave o PIN de seguridad (`admin_secret`), emitiendo un token JWT firmado (cookie HttpOnly y payload JSON).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - document_id
              properties:
                document_id:
                  type: string
                  description: Cédula de identidad (ej. 13537582, V-18456123) o correo electrónico institucional.
                  example: "13537582"
                admin_secret:
                  type: string
                  format: password
                  description: PIN o clave secreta institucional para cuentas con rol administrativo (admin, director, supervisor).
                  example: "123456"
                is_admin_login:
                  type: boolean
                  description: Bandera que indica solicitud de acceso al portal de administración y gobernanza.
                  example: true
                require_admin:
                  type: boolean
                  description: Alias de verificación estricta de privilegios administrativos.
                  example: true
                passkey_proof:
                  type: object
                  description: Prueba criptográfica opcional de autenticación biométrica FIDO2.
      responses:
        '200':
          description: Autenticación exitosa
          headers:
            Set-Cookie:
              schema:
                type: string
                example: sgbt_session=eyJhbGci...; Path=/; HttpOnly; SameSite=Strict
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Solicitud inválida o trampa anti-automatización activada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Acceso denegado por falta de privilegios administrativos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Documento o correo no encontrado en la nómina institucional
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/logout:
    post:
      tags:
        - Autenticación & Passkeys
      summary: Cerrar sesión e invalidar token
      description: Destruye la cookie de sesión y añade el token actual a la tabla de revocación persistente (revoked_tokens).
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Sesión cerrada y token revocado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Sesión cerrada exitosamente

  /auth/enrollment-status/{document_id}:
    get:
      tags:
        - Autenticación & Passkeys
      summary: Consultar estado de formalización del beneficiario
      description: Retorna si el funcionario ya completó la carga de fotografía, contraseña y vinculación de dispositivo.
      parameters:
        - name: document_id
          in: path
          required: true
          description: Número de Cédula de Identidad con o sin prefijo
          schema:
            type: string
            example: "V-18456123"
      responses:
        '200':
          description: Estado del expediente digital
          content:
            application/json:
              schema:
                type: object
                properties:
                  found:
                    type: boolean
                    example: true
                  enrollment_status:
                    type: string
                    example: "registrado"
                  has_photo:
                    type: boolean
                    example: true
                  worker:
                    $ref: '#/components/schemas/User'
        '404':
          description: Funcionario no encontrado en la nómina
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/enroll:
    post:
      tags:
        - Autenticación & Passkeys
      summary: Formalizar beneficiario con fotografía y contraseña
      description: Registra la fotografía (cámara o galería), contraseña y dispositivo móvil del beneficiario, persistiendo los datos de inmediato en Supabase Cloud.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - document_id
                - password
                - photo_base64
              properties:
                document_id:
                  type: string
                  example: "V-18456123"
                password:
                  type: string
                  format: password
                  example: "ClaveSegura2026*"
                photo_base64:
                  type: string
                  description: Imagen codificada en formato Base64 (data:image/jpeg;base64,...)
                device_id:
                  type: string
                  example: "dev_mobile_s22"
      responses:
        '200':
          description: Formalización completada con éxito y persistida en Supabase Cloud
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Formalización completada y persistida en la nube con éxito"
        '400':
          description: Datos incompletos o formato inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/password-recovery/request:
    post:
      tags:
        - Autenticación & Passkeys
      summary: Solicitar recuperación de contraseña (Paso 1)
      description: Valida la Cédula de Identidad contra el correo o teléfono registrado en nómina y emite un token de recuperación HMAC de 15 minutos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - document_id
                - email_or_phone
              properties:
                document_id:
                  type: string
                  example: "V-18456123"
                email_or_phone:
                  type: string
                  example: "usuario@mippci.gob.ve"
      responses:
        '200':
          description: Identidad verificada y token emitido exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  recovery_token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  worker:
                    type: object
                    properties:
                      full_name:
                        type: string
                        example: "Carlos Eduardo Mendoza"
                      document_id:
                        type: string
                        example: "V-18456123"
                      masked_email:
                        type: string
                        example: "c***a@mippci.gob.ve"
        '400':
          description: Datos de contacto no coinciden con el registro de nómina
        '404':
          description: Cédula no encontrada en el padrón institucional

  /auth/password-recovery/confirm:
    post:
      tags:
        - Autenticación & Passkeys
      summary: Confirmar nueva contraseña de beneficiario (Paso 2)
      description: Valida el token temporal y asigna la nueva contraseña encriptada en la base de datos y Supabase Cloud.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - recovery_token
                - new_password
              properties:
                recovery_token:
                  type: string
                new_password:
                  type: string
                  example: "claveSegura2026"
      responses:
        '200':
          description: Contraseña restablecida exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Contraseña restablecida exitosamente."
                  document_id:
                    type: string
                    example: "V-18456123"
        '400':
          description: Token expirado o contraseña inválida

  /admin/workers/{id}/password:
    post:
      tags:
        - Nómina & Beneficiarios
      summary: Asignar contraseña manual o restablecer a precargado (Administración)
      description: Exclusivo para administradores. Permite asignar una contraseña personalizada o restablecer el estatus del funcionario a precargado para forzar auto-registro.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  example: "clave1234"
                reset_to_precargado:
                  type: boolean
                  example: false
      responses:
        '200':
          description: Contraseña o estatus actualizado correctamente
        '401':
          description: No autorizado
        '403':
          description: Privilegios insuficientes (requiere admin o director)

  /auth/passkey/register-challenge:
    post:
      tags:
        - Autenticación & Passkeys
      summary: Solicitar desafío de registro WebAuthn
      description: Genera las opciones de creación de credencial biométrica FIDO2 para un beneficiario o supervisor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cedula
              properties:
                cedula:
                  type: string
                  example: "V-12345678"
      responses:
        '200':
          description: Opciones de creación WebAuthn generadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge:
                    type: string
                    example: "dGVzdC1jaGFsbGVuZ2UtYmFzZTY0"
                  rp:
                    type: object
                    properties:
                      name:
                        type: string
                        example: "SGBT Combos MIPPCI"
                      id:
                        type: string
                        example: "localhost"
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      displayName:
                        type: string
                  pubKeyCredParams:
                    type: array
                    items:
                      type: object

  /auth/passkey/register-verify:
    post:
      tags:
        - Autenticación & Passkeys
      summary: Verificar y almacenar credencial WebAuthn
      description: Valida la firma del autenticador y registra la clave pública ECDSA P-256 en la base de datos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cedula
                - registrationResponse
              properties:
                cedula:
                  type: string
                  example: "V-12345678"
                registrationResponse:
                  type: object
      responses:
        '200':
          description: Passkey registrada con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Passkey registrada exitosamente

  /auth/passkey/auth-challenge:
    post:
      tags:
        - Autenticación & Passkeys
      summary: Solicitar desafío de autenticación WebAuthn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cedula
              properties:
                cedula:
                  type: string
                  example: "V-12345678"
      responses:
        '200':
          description: Desafío de autenticación generado

  /auth/passkey/auth-verify:
    post:
      tags:
        - Autenticación & Passkeys
      summary: Validar firma biométrica WebAuthn
      responses:
        '200':
          description: Firma verificada y sesión concedida

  /supervisor/daily-qr:
    get:
      tags:
        - Supervisor & Jornadas
      summary: Obtener código QR de jornada diario del supervisor
      description: Genera un payload con firma criptográfica HMAC-SHA256 válido únicamente hasta las 23:59:59 del día en curso.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Payload firmado diario
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  qr_payload:
                    type: string
                    example: "SGBT:V1:SUP-01:2026-10-25:SIGNATURE_HMAC"
                  supervisor_id:
                    type: string
                    example: "SUP-01"
                  date:
                    type: string
                    example: "2026-10-25"
                  expires_at:
                    type: string
                    example: "2026-10-25T23:59:59.000Z"

  /verify/qr:
    post:
      tags:
        - Despacho & Verificación
      summary: Verificar código QR de reclamo de beneficiario
      description: Valida la firma digital ECDSA P-256 o HMAC del código QR presentado, verifica elegibilidad y registra la entrega en base de datos.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - qr_data
              properties:
                qr_data:
                  type: string
                  description: Cadena codificada en el código QR del beneficiario
                  example: "SGBT:V1:V12345678:COMBO-01:SIG_BASE64"
                distribution_point_id:
                  type: integer
                  example: 1
      responses:
        '200':
          description: Entrega verificada y registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryRecord'
        '400':
          description: QR inválido, expirado o manipulado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Beneficio ya reclamado hoy (Duplicado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/delivery-stream:
    get:
      tags:
        - Despacho & Verificación
      summary: Canal de eventos en tiempo real (Server-Sent Events)
      description: Transmite eventos SSE instantáneos cada vez que se autoriza y confirma un despacho de combo.
      responses:
        '200':
          description: Flujo de eventos continuo
          content:
            text/event-stream:
              schema:
                type: string
                example: "event: delivery\ndata: {\"id\":102,\"cedula\":\"V-12345678\",\"combo_name\":\"Bolsa Familiar\"}\n\n"

  /auth/my-receipts:
    get:
      tags:
        - Autenticación & Passkeys
      summary: Consultar historial de recibos digitales del beneficiario
      description: Retorna la lista de entregas históricas liquidadas para el usuario autenticado, agrupadas por jornada institucional con peso bruto y combos.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Historial de recibos digitales obtenido con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  receipts:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/my-merkle-proof:
    get:
      tags:
        - Auditoría & Árbol Merkle
      summary: Auto-verificación de inclusión en Árbol Merkle Ministerial (RFC 6962)
      description: Permite al beneficiario autenticado auditar matemáticamente su entrega contra la raíz Merkle de la jornada, obteniendo la ruta logarítmica de inclusión O(log N).
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: delivery_id
          in: query
          required: false
          schema:
            type: string
          description: ID específico de entrega a verificar (por defecto la más reciente del usuario)
      responses:
        '200':
          description: Prueba de inclusión Merkle generada y matemáticamente válida
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  verified:
                    type: boolean
                    example: true
                  merkle_root:
                    type: string
                    example: "4a5e1e...b8f1"
                  leaf_hash:
                    type: string
                    example: "9b3c10...c12a"
                  tree_depth:
                    type: integer
                    example: 14
                  proof_length:
                    type: integer
                    example: 13
                  standard:
                    type: string
                    example: "RFC 6962 / SHA-256 Binary Merkle Tree"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: No se encontró registro de entrega sellada

  /admin/audit/merkle-verify:
    get:
      tags:
        - Auditoría & Árbol Merkle
      summary: Verificación pública e individual de comprobante Merkle
      description: Endpoint administrativo y de auditoría pública para verificar cualquier entrega por Cédula o Delivery ID contra el árbol Merkle sellado.
      parameters:
        - name: document_id
          in: query
          required: false
          schema:
            type: string
          description: Cédula de identidad del beneficiario
        - name: delivery_id
          in: query
          required: false
          schema:
            type: string
          description: Identificador de la entrega
      responses:
        '200':
          description: Resultado de la verificación Merkle
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
                    example: true
                  merkle_root:
                    type: string
                  total_deliveries_in_tree:
                    type: integer

  /notifications/vapid-public-key:
    get:
      tags:
        - Notificaciones & Web Push
      summary: Obtener clave pública VAPID (RFC 8291/8292)
      description: Retorna la clave pública ECDSA P-256 en formato base64url requerida por el PushManager del Service Worker.
      responses:
        '200':
          description: Clave pública VAPID entregada con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  publicKey:
                    type: string

  /notifications/subscribe:
    post:
      tags:
        - Notificaciones & Web Push
      summary: Registrar suscripción Web Push de dispositivo
      description: Almacena el endpoint y las claves criptográficas P-256 del dispositivo en la tabla push_subscriptions para alertas en segundo plano.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - subscription
              properties:
                subscription:
                  type: object
                  properties:
                    endpoint:
                      type: string
                    keys:
                      type: object
                      properties:
                        p256dh:
                          type: string
                        auth:
                          type: string
      responses:
        '200':
          description: Dispositivo suscrito exitosamente

  /notifications/unsubscribe:
    post:
      tags:
        - Notificaciones & Web Push
      summary: Cancelar suscripción Web Push
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - endpoint
              properties:
                endpoint:
                  type: string
      responses:
        '200':
          description: Suscripción cancelada

  /notifications/test-push:
    post:
      tags:
        - Notificaciones & Web Push
      summary: Enviar notificación push de prueba
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                message:
                  type: string
      responses:
        '200':
          description: Resultado del despacho push

  /manual-dispatch/combos:
    get:
      tags:
        - Despacho Manual & Contingencia
      summary: Listar combos alimenticios disponibles para entrega
      responses:
        '200':
          description: Lista de combos activos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Combo'

  /manual-dispatch/search-beneficiary:
    get:
      tags:
        - Despacho Manual & Contingencia
      summary: Buscar beneficiario por cédula para entrega manual
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Cédula o número de documento
          example: "12345678"
      responses:
        '200':
          description: Información del beneficiario y estado de retiro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beneficiary'
        '404':
          description: Beneficiario no registrado en nómina

  /manual-dispatch/deliver:
    post:
      tags:
        - Despacho Manual & Contingencia
      summary: Procesar y registrar una entrega manual de contingencia
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - beneficiary_id
                - combo_id
              properties:
                beneficiary_id:
                  type: integer
                  example: 15
                combo_id:
                  type: integer
                  example: 1
                observation:
                  type: string
                  example: "Entrega asistida por falta de teléfono móvil inteligente"
      responses:
        '201':
          description: Despacho manual registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryRecord'
        '409':
          description: Conflicto por intento de duplicación en el mismo día

  /manual-dispatch/history:
    get:
      tags:
        - Despacho Manual & Contingencia
      summary: Historial de despachos manuales del punto actual
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Lista histórica de entregas manuales

  /sync/status:
    get:
      tags:
        - Sincronización Offline-First
      summary: Consultar estado de sincronización local vs remota
      responses:
        '200':
          description: Métricas de sincronización
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending_push_count:
                    type: integer
                    example: 3
                  last_sync_timestamp:
                    type: string
                    example: "2026-10-25T01:30:00Z"
                  is_online:
                    type: boolean
                    example: true

  /sync/push:
    post:
      tags:
        - Sincronización Offline-First
      summary: Empujar transacciones locales offline a Supabase PostgreSQL
      responses:
        '200':
          description: Lote de entregas sincronizado exitosamente

  /sync/pull:
    get:
      tags:
        - Sincronización Offline-First
      summary: Descargar actualizaciones de nóminas y combos desde la nube
      responses:
        '200':
          description: Datos actualizados y aplicados a la base local

  /system/status:
    get:
      tags:
        - Sistema & Diagnóstico
      summary: Estado del servidor, motor criptográfico y base de datos
      responses:
        '200':
          description: Telemetría del sistema
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  db_type:
                    type: string
                    example: "SQLite (better-sqlite3)"
                  crypto_engine:
                    type: string
                    example: "ECDSA P-256 (ES256)"
                  timestamp:
                    type: string
                    example: "2026-10-25T06:30:00.000Z"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT provisto en la cabecera HTTP `Authorization: Bearer <token>`
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: Cookie de sesión protegida `HttpOnly; SameSite=Strict`

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: "admin"
        role:
          type: string
          enum: [admin, director, supervisor, operator]
          example: "admin"
        name:
          type: string
          example: "Administrador Central"

    Combo:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Combo Clap Familiar Premium"
        description:
          type: string
          example: "Arroz, harina de maíz, pasta, aceite, granos, leche en polvo"
        category:
          type: string
          example: "Alimentos Secos"
        weight_kg:
          type: number
          example: 15.5
        is_active:
          type: integer
          enum: [0, 1]
          example: 1

    Beneficiary:
      type: object
      properties:
        id:
          type: integer
          example: 104
        cedula:
          type: string
          example: "V-18765432"
        first_name:
          type: string
          example: "María"
        last_name:
          type: string
          example: "González"
        department:
          type: string
          example: "Dirección de Prensa y Comunicaciones"
        has_passkey:
          type: boolean
          example: true
        claimed_today:
          type: boolean
          example: false

    DeliveryRecord:
      type: object
      properties:
        id:
          type: integer
          example: 541
        beneficiary_id:
          type: integer
          example: 104
        combo_id:
          type: integer
          example: 1
        operator_id:
          type: integer
          example: 2
        verification_method:
          type: string
          enum: [passkey_biometric, daily_qr, manual_contingency]
          example: "passkey_biometric"
        dispatched_at:
          type: string
          format: date-time
          example: "2026-10-25T10:14:22Z"

    ProblemDetails:
      type: object
      description: Formato estándar de errores HTTP conforme a RFC 7807
      properties:
        type:
          type: string
          example: "https://sgbt-combos.gob.ve/errors/duplicate-claim"
        title:
          type: string
          example: "Beneficio ya reclamado hoy"
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: "El beneficiario V-18765432 ya retiró su combo en el punto 1 a las 08:30 AM"
        instance:
          type: string
          example: "/api/v1/verify/qr"

  responses:
    UnauthorizedError:
      description: Credenciales inválidas o token expirado/revocado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
