# ==============================================================================
# SGBT - CONFIGURACIÓN DE SEGURIDAD NGINX / REVERSE PROXY
# Mitigación perimetral para CVE-2026-111497 (Brotli Heap Buffer Overflow)
# ==============================================================================

# 1. Bloqueo perimetral de peticiones con Content-Encoding: br maliciosas
# Si un cliente externo envía una solicitud POST/PUT con codificación Brotli hacia la API
# Nginx la descarta antes de llegar a Node.js con código 415.
map $http_content_encoding $block_brotli_payloads {
    default 0;
    "~*br" 1;
    "~*brotli" 1;
}

server {
    listen 80;
    server_name sgbt.mippci.gob.ve;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sgbt.mippci.gob.ve;

    # Certificados SSL/TLS Ministeriales
    ssl_certificate /etc/ssl/certs/mippci_sgbt.crt;
    ssl_certificate_key /etc/ssl/private/mippci_sgbt.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Cabeceras de seguridad estrictas (Defense-in-Depth)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;

    # Límite máximo de subida de carga (coherente con Express 50MB)
    client_max_body_size 50M;

    # Regla de mitigación CVE-2026-111497:
    # Bloquear inmediatamente peticiones HTTP hacia /api/ con codificación de compresión en el cuerpo
    location /api/ {
        if ($block_brotli_payloads) {
            return 415 '{"error":"Unsupported Media Type: Content-Encoding Brotli no admitido por politica de seguridad CVE-2026-111497"}';
        }

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Evitar re-comprimir en tránsito payloads de la API
        proxy_set_header Accept-Encoding "";
    }

    # Servir Frontend y PWA
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
